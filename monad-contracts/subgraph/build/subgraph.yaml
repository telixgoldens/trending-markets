specVersion: 0.0.4
description: Trending Markets subgraph for Chapel Testnet
repository: https://github.com/telixgoldens/trending-markets
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum/contract
    name: MarketFactory
    network: chapel
    source:
      address: "0xd490A2739475B40908C83e2c21512a9876D093c8"
      abi: MarketFactory
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Market
      abis:
        - name: MarketFactory
          file: MarketFactory\MarketFactory.json
      eventHandlers:
        - event: MarketCreated(indexed address,indexed address,string,uint256)
          handler: handleMarketCreated
      file: MarketFactory\MarketFactory.wasm
templates:
  - name: BinaryMarket
    kind: ethereum/contract
    network: chapel
    source:
      abi: BinaryMarket
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Swap
        - LiquidityEvent
        - Resolution
        - Redemption
      abis:
        - name: BinaryMarket
          file: BinaryMarket\BinaryMarket.json
      eventHandlers:
        - event: LiquidityAdded(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityAdded
        - event: Swap(indexed address,uint8,uint256,uint256,uint256)
          handler: handleSwap
        - event: MarketResolved(uint8)
          handler: handleMarketResolved
        - event: Redeemed(indexed address,uint256,uint256)
          handler: handleRedeemed
      file: MarketFactory\MarketFactory.wasm
